name: LinkedIn Human Approval

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  decision:
    if: github.event.issue.pull_request == null && startsWith(github.event.issue.title, 'Content Review:')
    runs-on: ubuntu-latest
    steps:
      - name: Process human decision
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const command = (context.payload.comment.body || '').trim().toLowerCase();

            const labelDefs = {
              'content-review': { color: '1D76DB', description: 'Content review workflow item' },
              'review-required': { color: 'FBCA04', description: 'Human decision required before publishing' },
              'ready-to-publish': { color: '0E8A16', description: 'Human approved and ready for manual publishing' },
              'rejected': { color: 'D93F0B', description: 'Content rejected and requires revision' },
              'published': { color: '5319E7', description: 'Human confirmed the post was published' }
            };

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, ...labelDefs[name] });
                } else {
                  throw error;
                }
              }
            }

            async function removeLabelIfPresent(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (!['/approve', '/reject', '/published'].includes(command)) {
              core.info('Comment is not a workflow command. No action taken.');
              return;
            }

            for (const name of Object.keys(labelDefs)) {
              await ensureLabel(name);
            }

            if (command === '/approve') {
              await removeLabelIfPresent('review-required');
              await removeLabelIfPresent('rejected');
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['content-review', 'ready-to-publish'] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `✅ **Approved — Ready to Publish**\n\nA human can now publish the approved caption and creative manually on the Orion Effects LinkedIn Company Page.\n\nLinkedIn page: https://www.linkedin.com/company/orioneffects\n\nAfter the post is live, comment **/published** on this issue. The workflow will mark it published and close the review item.\n\n> No LinkedIn API credentials or contact@orioneffects.com access are required for this manual publishing stage.`
              });
              return;
            }

            if (command === '/reject') {
              await removeLabelIfPresent('ready-to-publish');
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['content-review', 'review-required', 'rejected'] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `🔁 **Revision required**\n\nThis item will not proceed to publishing. Update the caption/creative, then comment **/approve** when it is ready.`
              });
              return;
            }

            if (command === '/published') {
              await removeLabelIfPresent('ready-to-publish');
              await removeLabelIfPresent('review-required');
              await removeLabelIfPresent('rejected');
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['content-review', 'published'] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `🚀 **Published confirmed**\n\nHuman publishing has been recorded. Closing this content review item.`
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' });
            }
